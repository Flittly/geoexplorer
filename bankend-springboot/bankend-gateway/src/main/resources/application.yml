server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE

spring:
  application:
    name: bankend-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 全局 CORS 配置（Gateway 统一处理，下游服务不需要 CORS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          # 路由配置：按服务划分
          routes:
            # 1. 认证服务 (8001)
            - id: auth-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/auth/**
            - id: auth-service-admin
              uri: http://localhost:8001
              predicates:
                - Path=/api/admin/auth/**

            # 2. 用户服务 (8002) — 每个 Path 独立路由
            - id: user-levels
              uri: http://localhost:8002
              predicates:
                - Path=/api/levels/**
            - id: user-questions
              uri: http://localhost:8002
              predicates:
                - Path=/api/questions/**
            - id: user-mistakes
              uri: http://localhost:8002
              predicates:
                - Path=/api/mistakes/**
            - id: user-trivia
              uri: http://localhost:8002
              predicates:
                - Path=/api/trivia/**
            - id: user-users
              uri: http://localhost:8002
              predicates:
                - Path=/api/users/**
            - id: user-course-packages
              uri: http://localhost:8002
              predicates:
                - Path=/api/course-packages/**
            - id: user-courses
              uri: http://localhost:8002
              predicates:
                - Path=/api/courses/**
            - id: user-orders
              uri: http://localhost:8002
              predicates:
                - Path=/api/orders/**
            - id: user-my-courses
              uri: http://localhost:8002
              predicates:
                - Path=/api/my-courses/**
            - id: user-admin-courses
              uri: http://localhost:8002
              predicates:
                - Path=/api/admin/courses/**

            # 3. 内容服务 (8003) — 每个 Path 独立路由
            - id: content-posts
              uri: http://localhost:8003
              predicates:
                - Path=/api/posts/**
            - id: content-comments
              uri: http://localhost:8003
              predicates:
                - Path=/api/comments/**
            - id: content-likes
              uri: http://localhost:8003
              predicates:
                - Path=/api/likes/**
            - id: content-favorites
              uri: http://localhost:8003
              predicates:
                - Path=/api/favorites/**
            - id: content-admin-posts
              uri: http://localhost:8003
              predicates:
                - Path=/api/admin/posts/**

            # 4. 地理服务 (8004) — 每个 Path 独立路由
            - id: geo-features
              uri: http://localhost:8004
              predicates:
                - Path=/api/geo-features/**
            - id: geo-ar-landforms
              uri: http://localhost:8004
              predicates:
                - Path=/api/ar-landforms/**
            - id: geo-upload
              uri: http://localhost:8004
              predicates:
                - Path=/api/upload/**
            - id: geo-health
              uri: http://localhost:8004
              predicates:
                - Path=/health

# 网关鉴权配置
gateway:
  auth:
    whitelist:
      # 认证相关（公开）
      - /api/auth/login
      - /api/auth/login/**
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/send-code
      # 关卡和题目（公开浏览）
      - /api/levels
      - /api/levels/
      - /api/levels/**
      - /api/questions/**
      # 社区已审核帖子（公开浏览）
      - /api/posts/approved/**
      # 排行榜（公开）
      - /api/users/leaderboard
      # 地理要素和趣闻（公开）
      - /api/geo-features/**
      - /api/ar-landforms/**
      - /api/trivia/**
      # 课程商城（公开浏览）
      - /api/course-packages/**
      - /api/courses/**
      # 健康检查
      - /health
      - /actuator/**

jwt:
  secret: your-super-secret-jwt-key-change-in-production-geoexplorer-2024
