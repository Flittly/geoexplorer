server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE

spring:
  application:
    name: bankend-gateway
  cloud:
    gateway:
      server:
        webflux:
          # 全局 CORS 配置（Gateway 统一处理，下游服务不需要 CORS）
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600
          # 路由配置：按服务划分
          routes:
            # 1. 认证服务 (8001)
            - id: auth-service
              uri: http://localhost:8001
              predicates:
                - Path=/api/auth/**
            - id: auth-service-admin
              uri: http://localhost:8001
              predicates:
                - Path=/api/admin/auth/**

            # 2. 用户服务 (8002)
            - id: user-service
              uri: http://localhost:8002
              predicates:
                - Path=/api/levels/**
                - Path=/api/questions/**
                - Path=/api/mistakes/**
                - Path=/api/trivia/**
                - Path=/api/users/**

            # 3. 内容服务 (8003)
            - id: content-service
              uri: http://localhost:8003
              predicates:
                - Path=/api/posts/**
                - Path=/api/comments/**
                - Path=/api/likes/**
                - Path=/api/favorites/**
                - Path=/api/admin/posts/**

            # 4. 地理服务 (8004)
            - id: geo-service
              uri: http://localhost:8004
              predicates:
                - Path=/api/geo-features/**
                - Path=/api/ar-landforms/**
                - Path=/api/upload/**
                - Path=/health

# 网关鉴权配置
gateway:
  auth:
    whitelist:
      # 认证相关（公开）
      - /api/auth/login
      - /api/auth/login/**
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/send-code
      # 关卡和题目（公开浏览）
      - /api/levels
      - /api/levels/
      - /api/levels/**
      - /api/questions/**
      # 社区已审核帖子（公开浏览）
      - /api/posts/approved/**
      # 地理要素和趣闻（公开）
      - /api/geo-features/**
      - /api/ar-landforms/**
      - /api/trivia/**
      # 健康检查
      - /health
      - /actuator/**

jwt:
  secret: your-super-secret-jwt-key-change-in-production-geoexplorer-2024
