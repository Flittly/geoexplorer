server:
  port: 8003

spring:
  application:
    name: bankend-content-service
  datasource:
    url: jdbc:mysql://localhost:3306/geoexplorer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    property-naming-strategy: SNAKE_CASE

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.flittly.bankendspringboot.entity
  type-handlers-package: com.flittly.bankendspringboot.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: your-super-secret-jwt-key-change-in-production-geoexplorer-2024
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  cors:
    origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
